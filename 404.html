<style>
:root{--paper:#f5f0e4;--paper-hi:#fffdf7;--ink:#292638;--muted:#625f70;--red:#b54d3b;--blue:#4f6383}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
main{max-width:560px;padding:42px 34px;border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);background:var(--paper-hi);text-align:center}
.kicker{margin:0 0 12px;color:var(--blue);font-family:'Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h1{margin:0 0 12px;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.02em;line-height:1.15}
p{margin:0 0 26px;color:var(--muted);font-size:15px;line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);color:var(--ink);background:var(--paper-hi);font-family:Georgia,serif;font-size:.9rem;font-weight:700;text-decoration:none}
a.primary{color:#fff;background:var(--red)}
a:hover{background:var(--blue);color:#fff}
a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Fandom Fate / 404</p>
  <h1>That page wandered off.</h1>
  <p>The quiz shelf is still here, though. Head back and pick a fandom.</p>
  <div class="links">
    <a class="primary" href="./index.html">Back to Fandom Fate</a>
  </div>
</main>
</body>
